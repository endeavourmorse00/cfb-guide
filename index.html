<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Football TV Guide</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      background-color: #ffffff !important;
      color: #0f172a !important;
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 24px;
      color: #0f172a;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.025em;
    }

    .controls {
      display: flex;
      gap: 16px;
      margin-bottom: 32px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.75rem;
      color: #475569;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    input, select {
      background-color: #ffffff !important;
      color: #0f172a !important;
      border: 1px solid #cbd5e1 !important;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      outline: none;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    input:focus, select:focus {
      border-color: #2563eb !important;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1100px;
    }

    .card {
      background-color: #ffffff !important;
      border: 1px solid #e2e8f0 !important;
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .time {
      font-size: 0.875rem;
      color: #475569;
      font-weight: 600;
    }

    .score-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .score-low {
      background-color: #f1f5f9;
      color: #475569;
    }

    .score-mid {
      background-color: #e0f2fe;
      color: #0369a1;
    }

    .score-good {
      background-color: #dcfce7;
      color: #15803d;
    }

    .score-high {
      background-color: #fef3c7;
      color: #b45309;
    }

    .score-elite {
      background-color: #fce7f3;
      color: #be185d;
      border: 1px solid #f472b6;
    }

    .matchup {
      font-size: 1.125rem;
      font-weight: 700;
      color: #0f172a !important;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .network {
      font-size: 0.875rem;
      color: #64748b;
      font-weight: 500;
    }

    .no-games {
      grid-column: 1 / -1;
      text-align: center;
      color: #64748b;
      margin-top: 48px;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>🏈 College Football TV Guide</h1>
  </header>

  <div class="controls">
    <div class="control-group">
      <label for="datePicker">Date</label>
      <select id="datePicker"></select>
    </div>

    <div class="control-group">
      <label for="scoreFilter">Min Watch Score</label>
      <select id="scoreFilter">
        <option value="0">All Games (0+)</option>
        <option value="5">Decent (5+)</option>
        <option value="10" selected>Good (10+)</option>
        <option value="15">Must Watch (15+)</option>
        <option value="20">Elite (20+)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="sortBy">Sort By</label>
      <select id="sortBy">
        <option value="time">Game Time</option>
        <option value="score">Score (High to Low)</option>
        <option value="network">Network (A–Z)</option>
      </select>
    </div>
  </div>

  <div class="grid" id="gamesGrid"></div>

  <script>
    let allGames = [];

    // 1. Date formatting helper for nice dropdown labels (e.g. "Sat, Aug 29, 2026")
function formatDateLabel(dateStr) {
  const [year, month, day] = dateStr.split('-').map(Number);
  const dateObj = new Date(year, month - 1, day);
  return dateObj.toLocaleDateString('en-US', {
    weekday: 'short',
    month: 'short',
    day: 'numeric',
    year: 'numeric'
  });
}

// 2. Updated loadGames function
async function loadGames() {
  try {
    const response = await fetch('games.json');
    allGames = await response.json();
    
    if (allGames && allGames.length > 0) {
      // Get sorted unique dates
      const uniqueDates = [...new Set(allGames.map(g => g.date))].sort();

      const dateSelect = document.getElementById('datePicker');
      dateSelect.innerHTML = '';
      
      // Populate dropdown options
      uniqueDates.forEach(date => {
        const option = document.createElement('option');
        option.value = date;
        option.textContent = formatDateLabel(date);
        dateSelect.appendChild(option);
      });

      // Find nearest future date (or default to first date)
      const defaultDate = getNearestFutureDate(allGames);
      dateSelect.value = defaultDate;
    }

    // Explicitly call renderGames AFTER populating the dropdown
    renderGames();
  } catch (err) {
    console.error('Error loading games:', err);
  }
}

// 3. Make sure event listeners use the 'change' event
document.getElementById('datePicker').addEventListener('change', renderGames);
document.getElementById('scoreFilter').addEventListener('change', renderGames);
document.getElementById('sortBy').addEventListener('change', renderGames);

// Initialize
loadGames();
    
  </script>
</body>
</html>
