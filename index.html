<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Football TV Guide</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-bottom: 20px;
      color: var(--accent);
      font-size: 1.8rem;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 0.75rem;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, select {
      background-color: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 1000px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .time {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
    }

    .score-badge {
      background-color: var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .matchup {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .network {
      font-size: 0.85rem;
      color: var(--subtext);
    }

    .no-games {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--subtext);
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <h1>College Football TV Guide</h1>

  <div class="controls">
    <div class="control-group">
      <label for="datePicker">Date</label>
      <input type="date" id="datePicker">
    </div>

    <div class="control-group">
      <label for="scoreFilter">Min Watch Score</label>
      <select id="scoreFilter">
        <option value="0">All Games (0+)</option>
        <option value="5">Decent (5+)</option>
        <option value="10" selected>Good (10+)</option>
        <option value="15">Must Watch (15+)</option>
        <option value="20">Elite (20+)</option>
      </select>
    </div>
  </div>

  <div class="grid" id="gamesGrid"></div>

  <script>
    let allGames = [];

    async function loadGames() {
      try {
        const response = await fetch('games.json');
        allGames = await response.json();
        
        // Default to the first available date in data if present
        if (allGames.length > 0) {
          document.getElementById('datePicker').value = allGames[0].date;
        }

        renderGames();
      } catch (err) {
        console.error('Error loading games:', err);
      }
    }

    function renderGames() {
      const selectedDate = document.getElementById('datePicker').value;
      const minScore = parseInt(document.getElementById('scoreFilter').value, 10);
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';

      const filtered = allGames.filter(game => {
        const matchesDate = !selectedDate || game.date === selectedDate;
        const matchesScore = (game.score || 0) >= minScore;
        return matchesDate && matchesScore;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="no-games">No games match your filters.</div>';
        return;
      }

      filtered.forEach(game => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <span class="time">${game.time}</span>
            <span class="score-badge">Score: ${game.score}</span>
          </div>
          <div class="matchup">${game.matchup}</div>
          <div class="network">📺 ${game.network}</div>
        `;
        grid.appendChild(card);
      });
    }

    document.getElementById('datePicker').addEventListener('change', renderGames);
    document.getElementById('scoreFilter').addEventListener('change', renderGames);

    loadGames();
  </script>
</body>
</html>
